<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Liberación de Chasis · Córdoba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background: #f4f6fa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .tab-bar { backdrop-filter: blur(4px); background: rgba(255,255,255,0.92); border-top: 1px solid #d0d7e2; }
    input, select, textarea { font-size: 16px !important; }
    .scroll-horizontal { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #modalIdentidad {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem;
    }
    #modalIdentidad .modal-card {
      background: white; max-width: 400px; width: 100%; border-radius: 2rem;
      padding: 2rem 1.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .hidden-modal { display: none !important; }
    #toastNotification {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 500;
      z-index: 9998;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      max-width: 90%;
      text-align: center;
      pointer-events: none;
    }
    #toastNotification.hidden-toast {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
    }
    #toastNotification i {
      margin-right: 8px;
    }
  </style>
</head>
<body class="pb-20 text-gray-800">

<!-- TOAST NOTIFICATIONS -->
<div id="toastNotification" class="hidden-toast">
  <i class="fas fa-info-circle"></i> <span id="toastMessage">Mensaje</span>
</div>

<!-- MODAL IDENTIFICACIÓN -->
<div id="modalIdentidad">
  <div class="modal-card">
    <h2 class="text-xl font-bold text-indigo-800 mb-1"><i class="fas fa-id-card"></i> Identifícate</h2>
    <p class="text-sm text-gray-500 mb-4">Ingresa tus datos para continuar. Solo se solicita la primera vez.</p>
    <form id="formIdentidad" class="space-y-3">
      <div>
        <label class="text-sm font-medium">Nombre completo</label>
        <input id="idNombre" class="w-full p-3 border rounded-xl bg-gray-50" placeholder="Ej: Juan Pérez" required />
      </div>
      <div>
        <label class="text-sm font-medium">ID / Código de empleado</label>
        <input id="idCodigo" class="w-full p-3 border rounded-xl bg-gray-50" placeholder="Ej: 12345" required />
      </div>
      <button type="submit" class="w-full py-3 bg-indigo-700 text-white rounded-xl font-bold"><i class="fas fa-check"></i> Guardar</button>
    </form>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" class="max-w-3xl mx-auto px-3 pt-4">
  <header class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-xl font-bold text-indigo-800 flex items-center gap-2">
        <i class="fas fa-truck"></i> Liberación
      </h1>
      <p class="text-xs text-gray-500">Planta Córdoba · <span id="liveClock" class="font-mono">--:--</span></p>
    </div>
    <div class="flex items-center gap-3">
      <button id="btnSync" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full"><i class="fas fa-sync"></i> Sincronizar</button>
      <span id="syncStatus" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full flex items-center gap-1">
        <i class="fas fa-cloud-upload-alt"></i> <span id="syncLabel">online</span>
      </span>
      <span id="onlineIndicator" class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
    </div>
  </header>

  <!-- CONTADORES -->
  <section class="grid grid-cols-3 gap-2 mb-4">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
      <span class="text-xs text-gray-500">Hoy</span>
      <p class="text-2xl font-bold text-indigo-700" id="totalHoy">0</p>
      <span class="text-[10px] text-gray-400">total</span>
    </div>
    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
      <span class="text-xs text-gray-500">Verde</span>
      <p class="text-2xl font-bold text-green-600" id="verdeHoy">0</p>
      <span class="text-[10px] text-gray-400">aprobado</span>
    </div>
    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-center">
      <span class="text-xs text-gray-500">Amarillo</span>
      <p class="text-2xl font-bold text-amber-500" id="amarilloHoy">0</p>
      <span class="text-[10px] text-gray-400">observación</span>
    </div>
  </section>
  <div class="flex flex-wrap gap-2 text-xs bg-white p-2 rounded-xl shadow-sm mb-3">
    <span class="text-gray-500">Desglose:</span>
    <span class="bg-indigo-50 px-2 py-1 rounded-full"><i class="fas fa-truck text-indigo-600"></i> Titano <strong id="countTitano">0</strong></span>
    <span class="bg-amber-50 px-2 py-1 rounded-full"><i class="fas fa-truck text-amber-600"></i> RAM <strong id="countRam">0</strong></span>
    <span class="bg-emerald-50 px-2 py-1 rounded-full"><i class="fas fa-car text-emerald-600"></i> Cronos <strong id="countCronos">0</strong></span>
  </div>

  <main id="mainContent" class="bg-white rounded-2xl shadow-md p-4 min-h-[420px] transition-all"></main>
</div>

<!-- TAB BAR -->
<nav class="fixed bottom-0 left-0 right-0 tab-bar flex justify-around items-center py-1 px-2 z-50 max-w-3xl mx-auto border-t">
  <button data-tab="registro" class="flex flex-col items-center text-xs py-1 px-3 text-indigo-700 font-medium active-tab border-b-2 border-indigo-600"><i class="fas fa-pen-alt text-lg"></i><span>Registro</span></button>
  <button data-tab="historial" class="flex flex-col items-center text-xs py-1 px-3 text-gray-500"><i class="fas fa-history text-lg"></i><span>Historial</span></button>
  <button data-tab="operarios" class="flex flex-col items-center text-xs py-1 px-3 text-gray-500"><i class="fas fa-users text-lg"></i><span>Operarios</span></button>
  <button data-tab="exportar" class="flex flex-col items-center text-xs py-1 px-3 text-gray-500"><i class="fas fa-file-export text-lg"></i><span>Exportar</span></button>
</nav>

<script>
  (function() {
    // ============================================================
    //  CONFIGURACIÓN DE SINCRONIZACIÓN (JSONBin)
    // ============================================================
    const JSONBIN_API_KEY = '$2a$10$uw1yzcp42gBdzl8PtC3B1uBVXxSqOHPwrO1OZXUNHLDfIGrgZktoy';   // <--- CAMBIAR
    const JSONBIN_BIN_ID = '6a975504da38895dfe2cfd99'; // <--- CAMBIAR

    // ----- ESTADO GLOBAL -----
    let state = {
      registros: [],
      operarios: [],
      sincronizado: false,
      online: navigator.onLine
    };

    const $main = document.getElementById('mainContent');
    const $totalHoy = document.getElementById('totalHoy');
    const $verdeHoy = document.getElementById('verdeHoy');
    const $amarilloHoy = document.getElementById('amarilloHoy');
    const $countTitano = document.getElementById('countTitano');
    const $countRam = document.getElementById('countRam');
    const $countCronos = document.getElementById('countCronos');
    const $syncLabel = document.getElementById('syncLabel');
    const $onlineIndicator = document.getElementById('onlineIndicator');
    const $modalIdentidad = document.getElementById('modalIdentidad');
    const $btnSync = document.getElementById('btnSync');
    const $toast = document.getElementById('toastNotification');
    const $toastMessage = document.getElementById('toastMessage');

    // ----- TOAST -----
    let toastTimeout = null;
    function mostrarToast(mensaje, tipo = 'info') {
      const iconos = { 'info':'fa-info-circle','success':'fa-check-circle','warning':'fa-exclamation-triangle','error':'fa-times-circle' };
      const colores = { 'info':'bg-blue-600','success':'bg-green-600','warning':'bg-amber-600','error':'bg-red-600' };
      $toast.className = colores[tipo] || 'bg-gray-800';
      $toastMessage.textContent = mensaje;
      $toast.innerHTML = `<i class="fas ${iconos[tipo] || 'fa-info-circle'}"></i> ${mensaje}`;
      $toast.classList.remove('hidden-toast');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => $toast.classList.add('hidden-toast'), 4000);
    }

    // ----- UTILS -----
    function hoyStr() { return new Date().toISOString().split('T')[0]; }
    function nowISO() { return new Date().toISOString(); }
    function formatFecha(iso) { return new Date(iso).toLocaleString('es-AR', { hour12: false }); }
    function generarId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
    function soloFecha(iso) { return iso ? iso.split('T')[0] : ''; }

    // ----- PERSISTENCIA -----
    function guardarLocal() {
      try {
        localStorage.setItem('chasis_registros', JSON.stringify(state.registros));
        localStorage.setItem('chasis_operarios', JSON.stringify(state.operarios));
      } catch(e) { console.warn('localStorage error', e); }
    }
    function cargarLocal() {
      try {
        const r = localStorage.getItem('chasis_registros');
        const o = localStorage.getItem('chasis_operarios');
        if (r) state.registros = JSON.parse(r);
        if (o) state.operarios = JSON.parse(o);
      } catch(e) { console.warn('carga local falló', e); }
    }

    // ----- IDENTIDAD -----
    const STORAGE_OPERARIO_ACTUAL = 'operario_actual_id';
    function getOperarioActualId() { return localStorage.getItem(STORAGE_OPERARIO_ACTUAL) || null; }
    function setOperarioActualId(id) { localStorage.setItem(STORAGE_OPERARIO_ACTUAL, id); }
    function asegurarOperarioActual() {
      const id = getOperarioActualId();
      if (id && state.operarios.some(o => o.id === id && o.activo)) return id;
      localStorage.removeItem(STORAGE_OPERARIO_ACTUAL);
      return null;
    }

    // ----- SINCRONIZACIÓN -----
    async function sincronizarConNube() {
      if (!JSONBIN_API_KEY.includes('TU_CLAVE_AQUI') || !JSONBIN_BIN_ID) return false;
      try {
        const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        if (!resp.ok) throw new Error('HTTP '+resp.status);
        const data = await resp.json();
        const cloud = data.record;
        if (cloud && cloud.registros && cloud.operarios) {
          if (cloud.registros && cloud.registros.length > 0) state.registros = cloud.registros;
          if (cloud.operarios && cloud.operarios.length > 0) state.operarios = cloud.operarios;
          guardarLocal();
          actualizarUI();
          return true;
        }
      } catch(e) { console.warn('Error sincronización', e); }
      return false;
    }

    async function subirANube() {
      if (!JSONBIN_API_KEY.includes('TU_CLAVE_AQUI') || !JSONBIN_BIN_ID) return false;
      try {
        const payload = { registros: state.registros, operarios: state.operarios, updated: nowISO() };
        const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error('HTTP '+resp.status);
        return true;
      } catch(e) { console.warn('subida falló', e); return false; }
    }

    let syncInterval = null;
    function iniciarSincronizacionPeriodica(segundos = 30) {
      if (syncInterval) clearInterval(syncInterval);
      syncInterval = setInterval(() => {
        if (navigator.onLine) {
          sincronizarConNube().then(ok => {
            state.sincronizado = ok;
            actualizarEstadoSync(ok);
            actualizarUI();
          });
        }
      }, segundos * 1000);
    }

    // ----- VALIDACIONES -----
    function chasisYaRegistradoGlobal(chasis) {
      const chasisLimpio = chasis.trim().toUpperCase();
      return state.registros.some(r => r.chasis === chasisLimpio);
    }

    function determinarTipoPorChasis(chasis) {
      const num = parseInt(chasis.trim());
      if (isNaN(num)) return null;
      const primerDigito = Math.abs(num).toString().charAt(0);
      switch(primerDigito) {
        case '5': return 'FIAT CRONOS';
        case '7': return 'FIAT TITANO';
        case '9': return 'RAM DAKOTA';
        default: return null;
      }
    }

    function esSoloNumeros(texto) { return /^\d+$/.test(texto.trim()); }

    // ----- REGISTRO -----
    function registrarLiberacion({ operarioId, tipo, chasis, condicion, obs }) {
      const operario = state.operarios.find(o => o.id === operarioId);
      if (!operario || !operario.activo) {
        mostrarToast('Operario no válido o inactivo', 'error');
        return false;
      }
      const chasisLimpio = chasis.trim().toUpperCase();
      if (!chasisLimpio) { mostrarToast('Ingrese número de chasis', 'warning'); return false; }
      if (!esSoloNumeros(chasisLimpio)) { mostrarToast('El chasis debe contener SOLO números', 'error'); return false; }
      if (chasisYaRegistradoGlobal(chasisLimpio)) {
        const existente = state.registros.find(r => r.chasis === chasisLimpio);
        const mensaje = existente
          ? `❌ El chasis ${chasisLimpio} ya fue registrado por ${existente.operario} el ${formatFecha(existente.fechaISO)}`
          : `❌ El chasis ${chasisLimpio} ya existe en el sistema`;
        mostrarToast(mensaje, 'error');
        return false;
      }

      let tipoFinal = tipo;
      if (!tipoFinal) {
        const detectado = determinarTipoPorChasis(chasisLimpio);
        if (detectado) tipoFinal = detectado;
        else { mostrarToast('El número no coincide con 5, 7 o 9', 'warning'); return false; }
      }

      const registro = {
        id: generarId(),
        operario: operario.nombre,
        operarioId: operario.id,
        tipo: tipoFinal,
        chasis: chasisLimpio,
        condicion: condicion,
        obs: obs || '',
        fechaISO: nowISO(),
        timestamp: Date.now()
      };
      state.registros.push(registro);
      guardarLocal();
      actualizarUI();
      mostrarToast(`✅ Registro exitoso: ${chasisLimpio} - ${condicion === 'verde' ? 'Verde' : 'Amarillo'}`, 'success');
      if (navigator.onLine) subirANube().then(() => actualizarEstadoSync(true));
      return true;
    }

    function eliminarRegistro(id) {
      if (!confirm('¿Eliminar este registro?')) return;
      state.registros = state.registros.filter(r => r.id !== id);
      guardarLocal();
      actualizarUI();
      if (navigator.onLine) subirANube();
      mostrarToast('Registro eliminado', 'info');
    }

    // ----- OPERARIOS -----
    function agregarOperario(nombre, codigo) {
      if (!nombre || !codigo) { mostrarToast('Nombre y código requeridos', 'warning'); return false; }
      if (state.operarios.some(o => o.codigo === codigo)) { mostrarToast('Código ya existe', 'warning'); return false; }
      state.operarios.push({ id: generarId(), nombre, codigo, activo: true });
      guardarLocal();
      actualizarUI();
      if (navigator.onLine) subirANube();
      mostrarToast(`Operario ${nombre} agregado`, 'success');
      return true;
    }
    function toggleOperario(id) {
      const op = state.operarios.find(o => o.id === id);
      if (op) {
        op.activo = !op.activo;
        guardarLocal();
        actualizarUI();
        if (navigator.onLine) subirANube();
        mostrarToast(`Operario ${op.nombre} ${op.activo ? 'activado' : 'desactivado'}`, 'info');
      }
    }
    function eliminarOperario(id) {
      if (!confirm('Eliminar operario (no borra registros)')) return;
      const op = state.operarios.find(o => o.id === id);
      state.operarios = state.operarios.filter(o => o.id !== id);
      guardarLocal();
      actualizarUI();
      if (navigator.onLine) subirANube();
      if (op) mostrarToast(`Operario ${op.nombre} eliminado`, 'info');
    }

    // ----- EXPORTAR (SOLO DÍA) -----
    function exportarExcel(dia) {
      const registros = state.registros.filter(r => soloFecha(r.fechaISO) === dia);
      if (registros.length === 0) {
        mostrarToast('No hay registros para esta fecha', 'warning');
        return;
      }
      const data = registros.map(r => ({
        'Fecha': formatFecha(r.fechaISO),
        'Operario': r.operario,
        'Tipo': r.tipo,
        'Chasis': r.chasis,
        'Condición': r.condicion === 'verde' ? 'VERDE' : 'AMARILLO',
        'Observación': r.obs || ''
      }));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, 'Liberaciones');
      XLSX.writeFile(wb, `Liberaciones_${dia}.xlsx`);
      mostrarToast('Excel exportado correctamente', 'success');
    }

    function exportarPDF(dia) {
      const registros = state.registros.filter(r => soloFecha(r.fechaISO) === dia);
      if (registros.length === 0) {
        mostrarToast('No hay registros para esta fecha', 'warning');
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'pt', 'a4');
      doc.setFontSize(14);
      doc.text('Registro de Liberación de Chasis - Planta Córdoba', 40, 40);
      doc.setFontSize(9);
      doc.text(`Exportado: ${new Date().toLocaleString()}`, 40, 60);
      const rows = registros.map(r => [
        formatFecha(r.fechaISO), r.operario, r.tipo, r.chasis,
        r.condicion === 'verde' ? 'VERDE' : 'AMARILLO', r.obs || ''
      ]);
      doc.autoTable({
        head: [['Fecha', 'Operario', 'Tipo', 'Chasis', 'Condición', 'Observación']],
        body: rows,
        startY: 70,
        styles: { fontSize: 8, cellPadding: 3 },
        headStyles: { fillColor: [41, 98, 150] }
      });
      doc.save(`Liberaciones_${dia}.pdf`);
      mostrarToast('PDF exportado correctamente', 'success');
    }

    // ----- ACTUALIZAR UI -----
    function actualizarUI() {
      const hoy = hoyStr();
      const hoyReg = state.registros.filter(r => soloFecha(r.fechaISO) === hoy);
      $totalHoy.textContent = hoyReg.length;
      $verdeHoy.textContent = hoyReg.filter(r => r.condicion === 'verde').length;
      $amarilloHoy.textContent = hoyReg.filter(r => r.condicion === 'amarillo').length;
      $countTitano.textContent = hoyReg.filter(r => r.tipo === 'FIAT TITANO').length;
      $countRam.textContent = hoyReg.filter(r => r.tipo === 'RAM DAKOTA').length;
      $countCronos.textContent = hoyReg.filter(r => r.tipo === 'FIAT CRONOS').length;

      const active = document.querySelector('[data-tab].active-tab')?.dataset.tab || 'registro';
      renderTab(active);
    }

    // ----- RENDER TABS -----
    function renderTab(tab) {
      const opcionesTipo = ['FIAT TITANO', 'RAM DAKOTA', 'FIAT CRONOS'];
      const htmlOperarios = state.operarios.map(o =>
        `<option value="${o.id}" ${o.activo ? '' : 'disabled'}>${o.nombre} (${o.codigo}) ${o.activo ? '' : '❌'}</option>`
      ).join('');
      const operarioActualId = asegurarOperarioActual();

      if (tab === 'registro') {
        $main.innerHTML = `
          <h2 class="text-lg font-semibold mb-3"><i class="fas fa-clipboard-list text-indigo-600"></i> Nuevo registro</h2>
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-sm text-amber-800">
            <i class="fas fa-info-circle"></i> Cada chasis solo puede registrarse UNA VEZ.
          </div>
          <form id="formRegistro" class="space-y-3">
            <div>
              <label class="text-sm font-medium">Operario</label>
              <select id="selOperario" class="w-full p-3 border rounded-xl bg-gray-50">${htmlOperarios}</select>
            </div>
            <div>
              <label class="text-sm font-medium">Tipo de vehículo</label>
              <select id="selTipo" class="w-full p-3 border rounded-xl bg-gray-50">
                <option value="">Seleccionar (opcional)</option>
                ${opcionesTipo.map(t => `<option value="${t}">${t}</option>`).join('')}
              </select>
              <p class="text-xs text-gray-400 mt-1">Si no seleccionas, se detecta por el primer dígito (5=Cronos, 7=Titano, 9=RAM)</p>
            </div>
            <div>
              <label class="text-sm font-medium">Chasis</label>
              <div class="flex gap-2">
                <input id="inputChasis" class="flex-1 p-3 border rounded-xl bg-gray-50" placeholder="SOLO números" type="text" inputmode="numeric" />
                <button type="button" id="btnScan" class="bg-indigo-100 px-4 rounded-xl text-indigo-700"><i class="fas fa-qrcode"></i></button>
              </div>
            </div>
            <div>
              <label class="text-sm font-medium">Observaciones</label>
              <input id="inputObs" class="w-full p-3 border rounded-xl bg-gray-50" placeholder="Opcional" />
            </div>
            <div class="flex gap-3">
              <button type="button" id="btnVerde" class="flex-1 py-3 bg-green-600 text-white rounded-xl font-medium"><i class="fas fa-check-circle"></i> Verde</button>
              <button type="button" id="btnAmarillo" class="flex-1 py-3 bg-amber-500 text-white rounded-xl font-medium"><i class="fas fa-exclamation-triangle"></i> Amarillo</button>
            </div>
            <div class="text-xs text-gray-400">Atajos: F1=Verde F2=Amarillo F3=Chasis</div>
          </form>
        `;

        const selOp = document.getElementById('selOperario');
        const selTipo = document.getElementById('selTipo');
        const inputChasis = document.getElementById('inputChasis');
        const inputObs = document.getElementById('inputObs');
        const btnVerde = document.getElementById('btnVerde');
        const btnAmarillo = document.getElementById('btnAmarillo');

        if (operarioActualId && selOp) {
          if (state.operarios.some(o => o.id === operarioActualId && o.activo)) {
            selOp.value = operarioActualId;
          }
        }

        inputChasis.addEventListener('input', function() {
          this.value = this.value.replace(/[^0-9]/g, '');
          if (this.value.length > 0) {
            const tipoDetectado = determinarTipoPorChasis(this.value);
            if (tipoDetectado) {
              for (let option of selTipo.options) {
                if (option.value === tipoDetectado) {
                  selTipo.value = tipoDetectado;
                  break;
                }
              }
              selTipo.style.borderColor = '#22c55e';
              selTipo.style.backgroundColor = '#f0fdf4';
            } else {
              selTipo.style.borderColor = '#f59e0b';
              selTipo.style.backgroundColor = '#fffbeb';
            }
          } else {
            selTipo.style.borderColor = '';
            selTipo.style.backgroundColor = '';
          }
        });

        function doRegistro(condicion) {
          const opId = selOp.value;
          if (!opId) { mostrarToast('Seleccione un operario', 'warning'); return; }
          if (!inputChasis.value || inputChasis.value.trim() === '') {
            mostrarToast('Ingrese un número de chasis', 'warning');
            inputChasis.focus();
            return;
          }
          let tipoSeleccionado = selTipo.value;
          if (!tipoSeleccionado) {
            const detectado = determinarTipoPorChasis(inputChasis.value);
            if (detectado) tipoSeleccionado = detectado;
            else { mostrarToast('El chasis no coincide con 5, 7 o 9', 'warning'); selTipo.focus(); return; }
          }
          const ok = registrarLiberacion({
            operarioId: opId,
            tipo: tipoSeleccionado,
            chasis: inputChasis.value,
            condicion: condicion,
            obs: inputObs.value
          });
          if (ok) {
            inputChasis.value = '';
            inputObs.value = '';
            selTipo.value = '';
            selTipo.style.borderColor = '';
            selTipo.style.backgroundColor = '';
            inputChasis.focus();
          }
        }

        btnVerde.addEventListener('click', (e) => { e.preventDefault(); doRegistro('verde'); });
        btnAmarillo.addEventListener('click', (e) => { e.preventDefault(); doRegistro('amarillo'); });
        document.addEventListener('keydown', function handler(e) {
          if (e.key === 'F1') { e.preventDefault(); btnVerde.click(); }
          if (e.key === 'F2') { e.preventDefault(); btnAmarillo.click(); }
          if (e.key === 'F3') { e.preventDefault(); inputChasis.focus(); }
        });
        document.getElementById('btnScan').addEventListener('click', () => {
          const fake = Math.floor(1000000 + Math.random() * 9000000).toString();
          inputChasis.value = fake;
          inputChasis.dispatchEvent(new Event('input'));
          mostrarToast(`Chasis simulado: ${fake}`, 'info');
        });

        window._refreshOperarios = () => {
          const sel = document.getElementById('selOperario');
          if (sel) {
            const current = sel.value;
            sel.innerHTML = state.operarios.map(o =>
              `<option value="${o.id}" ${o.activo ? '' : 'disabled'}>${o.nombre} (${o.codigo}) ${o.activo ? '' : '❌'}</option>`
            ).join('');
            if (state.operarios.some(o => o.id === current && o.activo)) sel.value = current;
            else if (operarioActualId && state.operarios.some(o => o.id === operarioActualId && o.activo)) sel.value = operarioActualId;
          }
        };
      }
      else if (tab === 'historial') {
        // Solo dos filtros: chasis y día
        $main.innerHTML = `
          <h2 class="text-lg font-semibold mb-3"><i class="fas fa-history text-indigo-600"></i> Historial</h2>
          <div class="flex flex-wrap gap-2 mb-3">
            <div class="flex-1 min-w-[120px]">
              <label class="text-xs text-gray-500">Día</label>
              <input id="filterDia" type="date" class="w-full p-2 border rounded-lg" value="${hoyStr()}" />
            </div>
            <div class="flex-1 min-w-[120px]">
              <label class="text-xs text-gray-500">Chasis</label>
              <input id="filterChasis" class="w-full p-2 border rounded-lg" placeholder="Buscar..." />
            </div>
          </div>
          <div class="scroll-horizontal">
            <table class="w-full text-sm">
              <thead><tr class="bg-gray-100"><th class="p-2">Fecha</th><th class="p-2">Operario</th><th class="p-2">Tipo</th><th class="p-2">Chasis</th><th class="p-2">Cond</th><th class="p-2"></th></tr></thead>
              <tbody id="tablaHistorial"></tbody>
            </table>
          </div>
          <p id="noRegistros" class="text-gray-400 text-sm mt-3 hidden">Sin registros con esos filtros</p>
        `;

        function actualizarHistorial() {
          const dia = document.getElementById('filterDia').value;
          const chasisBuscar = document.getElementById('filterChasis').value.toLowerCase().trim();
          let registros = state.registros.slice().reverse();
          // Filtrar por día
          if (dia) {
            registros = registros.filter(r => soloFecha(r.fechaISO) === dia);
          }
          // Filtrar por chasis
          if (chasisBuscar) {
            registros = registros.filter(r => r.chasis.toLowerCase().includes(chasisBuscar));
          }
          const tbody = document.getElementById('tablaHistorial');
          const noReg = document.getElementById('noRegistros');
          if (registros.length === 0) {
            tbody.innerHTML = '';
            noReg.classList.remove('hidden');
            return;
          }
          noReg.classList.add('hidden');
          tbody.innerHTML = registros.map(r => `
            <tr class="border-b">
              <td class="p-1 text-[10px]">${formatFecha(r.fechaISO)}</td>
              <td class="p-1 text-xs">${r.operario}</td>
              <td class="p-1 text-xs">${r.tipo.split(' ').pop()}</td>
              <td class="p-1 font-mono text-xs">${r.chasis}</td>
              <td class="p-1"><span class="px-2 py-0.5 rounded-full text-white text-[10px] ${r.condicion==='verde'?'bg-green-600':'bg-amber-500'}">${r.condicion==='verde'?'V':'A'}</span></td>
              <td class="p-1"><button class="text-red-400 text-sm" onclick="window.eliminarRegistro('${r.id}')"><i class="fas fa-trash-alt"></i></button></td>
            </tr>
          `).join('');
        }

        document.getElementById('filterDia').addEventListener('change', actualizarHistorial);
        document.getElementById('filterChasis').addEventListener('input', actualizarHistorial);
        actualizarHistorial();
      }
      else if (tab === 'operarios') {
        $main.innerHTML = `
          <h2 class="text-lg font-semibold mb-3"><i class="fas fa-users-cog text-indigo-600"></i> Operarios</h2>
          <div class="flex gap-2 mb-3">
            <input id="newNombre" class="flex-1 p-2 border rounded-lg" placeholder="Nombre" />
            <input id="newCodigo" class="w-20 p-2 border rounded-lg" placeholder="Código" />
            <button id="btnAddOp" class="bg-indigo-600 text-white px-4 rounded-lg"><i class="fas fa-plus"></i></button>
          </div>
          <ul class="space-y-2">
            ${state.operarios.map(o => `
              <li class="flex justify-between items-center bg-gray-50 p-2 rounded-xl">
                <span><strong>${o.nombre}</strong> <span class="text-xs text-gray-500">${o.codigo}</span> ${o.activo?'<span class="text-green-500 text-xs">activo</span>':'<span class="text-red-400 text-xs">inactivo</span>'}</span>
                <span>
                  <button class="text-sm px-2 text-blue-500" onclick="window.toggleOperario('${o.id}')"><i class="fas ${o.activo?'fa-toggle-on':'fa-toggle-off'}"></i></button>
                  <button class="text-sm px-2 text-red-400" onclick="window.eliminarOperario('${o.id}')"><i class="fas fa-user-minus"></i></button>
                </span>
              </li>
            `).join('')}
          </ul>
        `;
        document.getElementById('btnAddOp')?.addEventListener('click', () => {
          const n = document.getElementById('newNombre').value.trim();
          const c = document.getElementById('newCodigo').value.trim();
          if (agregarOperario(n, c)) {
            document.getElementById('newNombre').value = '';
            document.getElementById('newCodigo').value = '';
            actualizarUI();
          }
        });
      }
      else if (tab === 'exportar') {
        $main.innerHTML = `
          <h2 class="text-lg font-semibold mb-3"><i class="fas fa-file-export text-indigo-600"></i> Exportar</h2>
          <div class="space-y-3">
            <div>
              <label class="text-sm font-medium">Seleccionar día</label>
              <input id="exportDia" type="date" class="w-full p-3 border rounded-xl bg-gray-50" value="${hoyStr()}" />
            </div>
            <button id="btnExcel" class="w-full py-3 bg-green-700 text-white rounded-xl"><i class="fas fa-file-excel"></i> Exportar Excel</button>
            <button id="btnPDF" class="w-full py-3 bg-red-700 text-white rounded-xl"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
          </div>
        `;
        document.getElementById('btnExcel').addEventListener('click', () => {
          const dia = document.getElementById('exportDia').value;
          if (!dia) { mostrarToast('Seleccione un día', 'warning'); return; }
          exportarExcel(dia);
        });
        document.getElementById('btnPDF').addEventListener('click', () => {
          const dia = document.getElementById('exportDia').value;
          if (!dia) { mostrarToast('Seleccione un día', 'warning'); return; }
          exportarPDF(dia);
        });
      }
      actualizarEstadoSync(state.sincronizado);
      if (window._refreshOperarios) window._refreshOperarios();
    }

    function actualizarEstadoSync(ok) {
      const label = document.getElementById('syncLabel');
      const indicator = document.getElementById('onlineIndicator');
      if (navigator.onLine) {
        label.textContent = ok ? 'sincronizado' : 'online';
        indicator.className = 'w-3 h-3 rounded-full ' + (ok ? 'bg-green-500' : 'bg-amber-400');
      } else {
        label.textContent = 'offline';
        indicator.className = 'w-3 h-3 rounded-full bg-gray-400';
      }
    }

    // ----- RELOJ -----
    function actualizarReloj() {
      document.getElementById('liveClock').textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // ----- NAVEGACIÓN -----
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('[data-tab]').forEach(b => {
          b.classList.remove('active-tab', 'text-indigo-700', 'border-b-2', 'border-indigo-600');
          b.classList.add('text-gray-500');
        });
        this.classList.add('active-tab', 'text-indigo-700', 'border-b-2', 'border-indigo-600');
        this.classList.remove('text-gray-500');
        renderTab(this.dataset.tab);
      });
    });

    // ----- INICIALIZACIÓN -----
    cargarLocal();

    function initIdentidad() {
      const operarioId = getOperarioActualId();
      if (operarioId && state.operarios.some(o => o.id === operarioId && o.activo)) {
        $modalIdentidad.classList.add('hidden-modal');
        document.querySelector('[data-tab="registro"]')?.click();
        return;
      }

      $modalIdentidad.classList.remove('hidden-modal');

      // Eliminar event listeners anteriores
      const form = document.getElementById('formIdentidad');
      const newForm = form.cloneNode(true);
      form.parentNode.replaceChild(newForm, form);

      newForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const nombre = document.getElementById('idNombre').value.trim();
        const codigo = document.getElementById('idCodigo').value.trim();
        if (!nombre || !codigo) {
          mostrarToast('Completa ambos campos', 'warning');
          return;
        }

        let op = state.operarios.find(o => o.codigo === codigo);
        if (!op) {
          const newId = generarId();
          op = { id: newId, nombre, codigo, activo: true };
          state.operarios.push(op);
          guardarLocal();
          if (navigator.onLine) subirANube();
          mostrarToast(`✅ Bienvenido ${nombre}`, 'success');
        } else {
          op.nombre = nombre;
          if (!op.activo) {
            op.activo = true;
            guardarLocal();
            if (navigator.onLine) subirANube();
          }
          mostrarToast(`✅ Bienvenido de nuevo ${nombre}`, 'success');
        }

        setOperarioActualId(op.id);
        $modalIdentidad.classList.add('hidden-modal');
        actualizarUI();
        if (window._refreshOperarios) window._refreshOperarios();
        document.querySelector('[data-tab="registro"]')?.click();
      });
    }

    $btnSync?.addEventListener('click', () => {
      if (navigator.onLine) {
        sincronizarConNube().then(ok => {
          state.sincronizado = ok;
          actualizarEstadoSync(ok);
          actualizarUI();
          mostrarToast(ok ? 'Sincronizado correctamente' : 'Error al sincronizar', ok ? 'success' : 'error');
        });
      } else {
        mostrarToast('Sin conexión a internet', 'error');
      }
    });

    if (navigator.onLine) {
      sincronizarConNube().then(ok => {
        state.sincronizado = ok;
        actualizarEstadoSync(ok);
        initIdentidad();
        actualizarUI();
        iniciarSincronizacionPeriodica(30);
      });
    } else {
      initIdentidad();
      actualizarUI();
    }

    window.addEventListener('online', () => {
      sincronizarConNube().then(ok => {
        state.sincronizado = ok;
        actualizarEstadoSync(ok);
        mostrarToast('Conexión restablecida', 'success');
      });
    });
    window.addEventListener('offline', () => {
      state.sincronizado = false;
      actualizarEstadoSync(false);
      mostrarToast('Sin conexión a internet', 'error');
    });

    window.eliminarRegistro = eliminarRegistro;
    window.toggleOperario = toggleOperario;
    window.eliminarOperario = eliminarOperario;

  })();
</script>
</body>
</html>
